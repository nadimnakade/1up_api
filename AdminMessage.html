    <script type="text/javascript">
        var username = "Naddy";//"Naddy_" + Math.random().toFixed(2) * 100;
        var ws = new WebSocket("ws://localhost:62489/WSS.ashx?chatName=" + username);
        window.onload = function () {
          
            fnAlive();
        }

        function fnAlive() {
            ws.onopen = function () {
                ws.send(document.getElementById('txtMsg').value); // this works
                //alert("Connection opened...");
            };

            ws.onerror = function (e) {
                console.log(e);
            }

            ws.onmessage = function (event) {
                document.getElementById('dvMsg').innerHTML = event.data;
            };

            ws.onclose = function () {
                //alert("Connection closed...");
                setTimeout(fnAlive, 1000);
            };
        }
