<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        /* Add some basic styling */
        body { font-family: sans-serif; display: grid; place-items: center; min-height: 80vh; }
        form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="email"], input[type="password"] { width: 300px; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #0052cc; color: white; border: none; }
        #error-message { color: red; }
    </style>
</head>
<body>
    <form id="login-form">
        <h2 id="login-title">Login</h2>
        <div id="error-message"></div>
        <div>
            <label for="email">User ID (Email):</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <input type="hidden" id="product" name="product">
        <button type="submit">Login</button>
    </form>

    <script>
        // This JavaScript runs as soon as the page loads
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const productInput = document.getElementById('product');
            const title = document.getElementById('login-title');
            const errorMessage = document.getElementById('error-message');

            // 1. Get the product name from the URL (e.g., "?product=nomadix")
            const params = new URLSearchParams(window.location.search);
            const product = params.get('product');

            if (!product) {
                // If no product is specified, show an error
                loginForm.innerHTML = "<h1>Error: No product specified.</h1>";
                return;
            }

            // 2. Set the hidden input value and update the title
            productInput.value = product;
            title.textContent = `Login for ${product.charAt(0).toUpperCase() + product.slice(1)}`;

            // 3. Add a submit event listener to the form
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Stop the form from refreshing the page
                errorMessage.textContent = ""; // Clear old errors

                const formData = new FormData(loginForm);
                const data = Object.fromEntries(formData.entries());

                try {
                    // 4. Send the login data to your C# Web API
                    const response = await fetch('/api/auth/productLogin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) {
                        // Handle login errors (e.g., 401 Unauthorized)
                        const error = await response.json();
                        errorMessage.textContent = error.Message || "Invalid User ID or Password.";
                    } else {
                        // 5. Get the redirect URL from the API's successful response
                        const result = await response.json();
                        if (result.redirectTo) {
                            // 6. Redirect the browser to Document360
                            window.location.href = result.redirectTo;
                        } else {
                            errorMessage.textContent = "Login successful, but no redirect URL was provided.";
                        }
                    }
                } catch (err) {
                    errorMessage.textContent = "A network error occurred. Please try again.";
                }
            });
        });
    </script>
</body>
</html>
