<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Workspace Documentation Demo</title>
    <link rel="stylesheet" href="/NEXUS_API/Content/doc360-multiworkspace.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; }
        h1 { margin-bottom: 8px; }
        .hint { color: #6c757d; margin-bottom: 24px; }
        .token-box { margin-bottom: 24px; }
        .token-box input { width: 100%; max-width: 720px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
        #content-container { border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; min-height: 200px; }
    </style>
</head>
<body>
    <h1>Multi-Workspace Documentation</h1>
    <p class="hint">
        Paste the JWT from your login redirect (<code>?token=...</code>) below, then load content.
        In production the injected Custom Script captures this automatically.
    </p>

    <div class="token-box">
        <input type="text" id="jwt-input" placeholder="Paste JWT token here">
        <p style="margin-top:8px">
            <button id="load-btn">Load Content</button>
        </p>
    </div>

    <div id="content-container"></div>

    <script>
        // Auto-capture ?token= like the production script does
        (function () {
            var m = location.search.match(/[?&]token=([^&]+)/);
            if (m) {
                var token = decodeURIComponent(m[1]);
                try { localStorage.setItem('doc360_jwt', token); } catch (e) {}
                document.getElementById('jwt-input').value = token;
                history.replaceState(null, '', location.pathname);
            } else {
                try {
                    var stored = localStorage.getItem('doc360_jwt');
                    if (stored) document.getElementById('jwt-input').value = stored;
                } catch (e) {}
            }
        })();

        document.getElementById('load-btn').addEventListener('click', function () {
            var token = document.getElementById('jwt-input').value.trim();
            var container = document.getElementById('content-container');

            if (!token) {
                container.innerHTML = '<div class="doc360-error"><p class="doc360-error-msg">Paste a JWT token first.</p></div>';
                return;
            }

            try { localStorage.setItem('doc360_jwt', token); } catch (e) {}

            container.innerHTML = '<div class="doc360-loading"><div class="doc360-spinner"></div><p>Loading documentation...</p></div>';

            fetch('https://1up.co.in/NEXUS_API/api/Document360/GetMultiWorkspaceContent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    Urls: [
                        'https://kms.cloud.global/trustedwifi/docs/getting-started',
                        'https://kms.cloud.global/trustedwifi/docs/administration',
                        'https://kms.cloud.global/nomadix/docs/installation',
                        'https://kms.cloud.global/nomadix/docs/configuration'
                    ]
                })
            }).then(function (r) {
                if (r.status === 401) {
                    throw new Error('401 — token missing, invalid, or expired.');
                }
                if (!r.ok) return r.text().then(function (t) { throw new Error('API error ' + r.status + ': ' + t); });
                return r.json();
            }).then(function (data) {
                renderResults(container, data);
            }).catch(function (err) {
                container.innerHTML = '<div class="doc360-error"><p class="doc360-error-msg">' + escapeHtml(err.message) + '</p></div>';
            });
        });

        function renderResults(container, data) {
            container.innerHTML = '';

            if (data.Message && !data.Success) {
                container.innerHTML = '<div class="doc360-empty">' + escapeHtml(data.Message) + '</div>';
                return;
            }

            var header = document.createElement('div');
            header.className = 'doc360-header';
            header.innerHTML = '<span class="doc360-badge">' + data.SuccessfulFetches + '/' + data.TotalWorkspaces + ' articles loaded</span>';
            container.appendChild(header);

            (data.Workspaces || []).forEach(function (ws) {
                var section = document.createElement('div');
                if (ws.Status === 'ok') {
                    var perm = (ws.Permission || '').toLowerCase();
                    section.className = 'doc360-workspace';
                    section.innerHTML =
                        '<div class="doc360-ws-header">' +
                            '<h2 class="doc360-ws-title">' + escapeHtml(ws.Title || 'Untitled') +
                            ' <span class="doc360-perm doc360-perm-' + (perm === 'edit' ? 'edit' : 'read') + '">' +
                            (perm === 'edit' ? 'Read & Edit' : 'Read-only') + '</span></h2>' +
                            '<div class="doc360-ws-url">' + escapeHtml(ws.Url) + ' · workspace: ' + escapeHtml(ws.Workspace) + '</div>' +
                        '</div>' +
                        '<div class="doc360-ws-body">' + (ws.HtmlContent || '') + '</div>';
                } else {
                    section.className = 'doc360-workspace doc360-ws-error';
                    section.innerHTML =
                        '<div class="doc360-ws-header"><h2 class="doc360-ws-title">' + escapeHtml(ws.Url) + '</h2></div>' +
                        '<div class="doc360-ws-error-msg"><span class="doc360-status">' + escapeHtml(ws.Status) + '</span> — ' +
                        escapeHtml(ws.Error || 'Unknown error') + '</div>';
                }
                container.appendChild(section);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }
    </script>
</body>
</html>
